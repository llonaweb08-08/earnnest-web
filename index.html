<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EarnNest Task</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <div id="ad-zone-sdk-banner" class="ad-zone ad-zone-fixed-top">[SDK Banner Placeholder]</div>

  <div id="loading-state" class="loading">Loading article…</div>

  <main id="article-container" style="display:none;">
    <h1 id="article-title"></h1>
    <div id="article-body"></div>

    <div id="ad-zone-outstream-video" class="ad-zone">[Outstream Video Placeholder]</div>

    <section id="claim-section" style="display:none;">
      <button id="claim-button" class="btn-primary">Claim Reward</button>
      <p id="claim-status"></p>
    </section>
  </main>

  <div id="ad-zone-interstitial" class="interstitial" style="display:none;">
    <div class="interstitial-content">
      <p>One moment…</p>
      <div id="countdown-number" class="countdown">5</div>
    </div>
  </div>

  <script src="js/task.js"></script>
</body>
</html>
